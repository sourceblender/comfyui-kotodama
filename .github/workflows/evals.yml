name: Eval protocol

on:
  pull_request:
    paths:
      - 'evals/**'
      - 'tests/test_eval_protocol.py'
      - '.github/workflows/evals.yml'
  push:
    branches: [main]
    paths:
      - 'evals/**'
      - 'tests/test_eval_protocol.py'
      - '.github/workflows/evals.yml'

# Superseded PR runs are cancelled; every merged main commit keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Check case schema and eval contract
        run: |
          python -c "from evals.run_prompts import load_cases, CASES; print(len(load_cases(CASES)), 'cases')"
          python tests/test_eval_protocol.py

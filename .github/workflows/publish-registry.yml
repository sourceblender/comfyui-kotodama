name: Test and publish to Comfy Registry

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - run: python -m pip install aiohttp 'tomli>=2,<3' 'pytest>=8'
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomli

          with open("pyproject.toml", "rb") as source:
              version = tomli.load(source)["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}"
          PY
      # pytest exits non-zero if it collects no tests, so a renamed or emptied
      # suite cannot pass the release gate by running nothing.
      - run: python -m pytest -q
      # Build the exact archive `comfy node publish` uploads and inspect it, so a
      # .comfyignore mistake fails the PR instead of shipping to every install.
      - name: Check Registry package contents
        run: |
          python -m pip install 'comfy-cli==1.21.0'
          comfy --skip-prompt --no-enable-telemetry node pack
          python - <<'PY2'
          import zipfile

          names = zipfile.ZipFile("node.zip").namelist()
          banned = ("evals/", "tests/", ".github/", ".claude/", "__pycache__/")
          dev_only = {"uv.lock"}
          leaked = [
              n for n in names
              if n.startswith(banned) or n.rsplit("/", 1)[-1] == ".env" or n.endswith(".pyc") or n in dev_only
          ]
          required = {"__init__.py", "pyproject.toml", "LICENSE", "README.md", "web/settings.js"}
          missing = sorted(required - set(names))
          size = sum(i.file_size for i in zipfile.ZipFile("node.zip").infolist())
          print(f"{len(names)} files, {size} bytes uncompressed")
          assert not leaked, f"must not ship: {leaked}"
          assert not missing, f"missing from package: {missing}"
          assert any(n.startswith("kotodama/") for n in names), "kotodama/ package missing"
          assert any(n.startswith("system_prompts/") for n in names), "system_prompts/ missing"
          assert size < 5_000_000, f"package unexpectedly large: {size} bytes"
          PY2

  publish:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'comfy-cli==1.21.0'
      - name: Publish reviewed release
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: comfy --skip-prompt --no-enable-telemetry node publish --token "$REGISTRY_ACCESS_TOKEN"

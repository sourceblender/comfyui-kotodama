[project]
name = "comfyui-kotodama"
version = "0.2.1"
description = "Text-to-image prompt enhancer for ComfyUI using an OpenAI-compatible chat endpoint"
requires-python = ">=3.10"
dependencies = []
license = { file = "LICENSE" }
classifiers = ["Operating System :: OS Independent"]
authors = [{name = "Eric Mey"}]

[project.urls]
# comfy-cli 1.21.0 publishes Homepage, Documentation, Repository and Issues; the
# Registry spec page names the issues link "Bug Tracker", so both are set.
Homepage = "https://github.com/sourceblender/comfyui-kotodama"
Repository = "https://github.com/sourceblender/comfyui-kotodama"
Documentation = "https://github.com/sourceblender/comfyui-kotodama#readme"
Issues = "https://github.com/sourceblender/comfyui-kotodama/issues"
"Bug Tracker" = "https://github.com/sourceblender/comfyui-kotodama/issues"

[dependency-groups]
# aiohttp is provided by ComfyUI at runtime; the settings tests need it here.
dev = ["pytest>=8", "ruff>=0.6", "aiohttp>=3.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Explicit, so a clone lints the same regardless of any parent ruff config.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.comfy]
PublisherId = "sourceblender"
DisplayName = "Kotodama Prompt Enhancer"
Icon = "https://raw.githubusercontent.com/sourceblender/comfyui-kotodama/main/docs/images/icon.png"
Banner = "https://raw.githubusercontent.com/sourceblender/comfyui-kotodama/main/docs/images/banner.png"
